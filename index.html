<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Find Friend | Sign Up</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Gveret+Levin&family=Indie+Flower&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <header>
      <nav aria-label="Main">
        <ul>
          <li><a href="#">Home</a></li>
          <li><a href="#">Browse</a></li>
          <li><a href="#">Profile</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <div class="title">
        <img src="hearts.png" alt="" class="heart1" /> <!-- alt="" because the images are decorative, and screenreaders don't need to read it -->
        <h1>Find Friend</h1>
        <img src="hearts.png" alt="" class="heart2" />
      </div>
      <h2>Sign Up</h2>

      <form action=""> <!-- method="post" -->

        <!-- Personal info + profile picture -->
        <section class="personal-info-and-photo">
          <section class="personal-info">
            <div class="FullName">
              <input type="text" placeholder="Name" name="Name" aria-label="Name" autocomplete="given-name" />
              <input type="text" placeholder="Surname" name="Surname" aria-label="Surname" autocomplete="family-name" />
            </div>

            <div class="Gender">
              <div>
                <input type="radio" id="male" name="gender" value="male" />
                <label for="male">Male</label>
              </div>
              <div>
                <input type="radio" id="female" name="gender" value="female" />
                <label for="female">Female</label>
              </div>
              <div>
                <input type="radio" id="other" name="gender" value="other" />
                <label for="other">Other</label>
              </div>
            </div>

            <div class="Birthday">
              <label for="birthdate">Birthdate:</label>
              <input type="date" id="birthdate" name="birthdate" autocomplete="bday" />
            </div>
          </section>

          <div class="Upload-Photo">
            <input type="file" id="upload-photo" hidden />
            <label for="upload-photo">+</label>
            <p>Profile Picture</p>
          </div>
        </section>

        <!-- Nationality + interests -->
        <section class="interests-nationalities">
          <select name="nationality" aria-label="Nationality" required>
            <option value="" disabled selected hidden>Nationality</option>
            <option value="estonian">Estonian</option>
            <option value="filipino">Filipino</option>
            <option value="norwegian">Norwegian</option>
            <option value="ukrainian">Ukrainian</option>
          </select>
          <select name="interests" aria-label="Interests" multiple size="1" required>
            <option value="" disabled selected hidden>Interests</option>
            <option value="books">Books</option>
            <option value="games">Games</option>
            <option value="movies">Movies</option>
            <option value="travel">Travel</option>
          </select>
        </section>

        <!-- Slider, about me, account details, terms -->
        <section class="the-rest">
          <div class="slider">
            <label for="social-attitude" class="visually-hidden">Social attitude</label>
            <span class="introvert-span">Introvert</span>
            <!-- max=9 is not very smooth, but it is easy to enter using just a keyboard -->
            <input type="range" id="social-attitude" name="social-attitude" aria-describedby="social-attitude-hint" min="1" max="9" />
            <span class="extrovert-span">Extrovert</span>
          </div>
          <p id="social-attitude-hint" class="visually-hidden">
            1 is the most introverted, 9 is the most extroverted
          </p>

          <fieldset>
            <legend>About me</legend>
            <textarea id="about-me" name="about-me" placeholder="Write a few words about yourself"></textarea>
          </fieldset>

          <div class="email-password">
            <div class="email">
              <label for="email">Email:</label>
              <input type="email" id="email" name="email" autocomplete="email" required />
            </div>
            <div class="password">
              <label for="password">Password:</label>
              <input type="password" id="password" name="password" autocomplete="new-password" required />
            </div>
          </div>

          <div class="agreement-of-terms">
            <input type="checkbox" id="agreement-of-terms" name="agreement-of-terms" value="agreed" required />
            <label for="agreement-of-terms">
              I agree to the <a href="https://www.youtube.com/watch?v=dQw4w9WgXcQ">terms of service</a>
            </label>
          </div>
        </section>

        <div class="button-container">
          <button type="submit" id="button">Sign Up</button>
        </div>
      </form>
    </main>

    <footer>
      <p>@Copyrights to VIA University College</p>
    </footer>

    <script>
      const slider = document.getElementById('social-attitude');

      function updateSliderProgress() {
        const ratio = (slider.value - slider.min) / (slider.max - slider.min);
        slider.style.setProperty('--progress', ratio);
      }

      slider.addEventListener('input', updateSliderProgress);
      updateSliderProgress();
    </script>
  </body>
</html>
