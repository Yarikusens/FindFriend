<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Find Friend | Sign Up</title>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find Friend | Sign up</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gveret+Levin&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Indie+Flower&display=swap" rel="stylesheet">

</head>
<body>
  <header>
    <nav>
      <ul>
        <li>
          <a href="#">Home</a>
        </li>
        <li>
          <a href="#">Browse</a>
        </li>
        <li>
          <a href="#">Profile</a>
        </li>
    </nav>
  </header>
  <main>
    <h1>Find Friend
      <img src="hearts.png" alt="heart decoration" class="heart1">
      <img src="hearts.png" alt="heart decoration2" class="heart2">
    </h1>
    <h2>Sign Up</h2>
    <form action=""> <!-- method="post" -->
        <section class="personal-info-and-photo">
            <section class="personal-info">
                <content class="FullName">
                    <input placeholder="Name" name="Name" autocomplete="name">
                    <input placeholder="Surname" name="Surname" autocomplete="family-name">
                </content>
    
                <br>
    
                <content class="Gender">
                  <div>
                    <input type="radio" id="male" name="gender" value="male">
                    <label for="male">Male</label>
                  </div>
                  <div>
                    <input type="radio" id="female" name="gender" value="female">
                    <label for="female">Female</label>
                  </div>
                  <div>
                    <input type="radio" id="other" name="gender" value="other">
                    <label for="other">Other</label>
                  </div>
                </content>
    
                <br>
    
                <content class="Birthday">
                    <label for="birthdate">Birthdate:</label>
                    <input type="date" id="birthdate" name="birthdate">
                </content>
            </section>

            <content class="Upload-Photo">
                <input type="file" id="upload-photo" hidden>
                <label for="upload-photo">+</label>
                <p>Profile Picture</p>

            </content>
      </section>

      <section class="interests-nationalities">

        <select name="nationality" required>
          <option value="" disabled selected>Nationality</option>
          <option value="estonian">Estonian</option>
          <option value="filipino">Filipino</option>
          <option value="norwegian">Norwegian</option>
          <option value="ukrainian">Ukrainian</option>
        </select>
        <select name="interests" multiple size="1" required>
          <option value="" disabled selected>Interests</option>
          <option value="games">Games</option>
          <option value="books">Books</option>
          <option value="movies">Movies</option>
          <option value="travel">Travel</option>
        </select>

      </section>

      <section class="the-rest">
        <label for="social-attitude" class="visually-hidden">Social attitude</label>
        <span>Introvert</span>
        <input type="range" id="social-attitude" name="social-attitude" aria-describedby="social-attitude-hint" min="1" max="9"> <!-- max=9 is not very smooth, but it is easy to enter using just a keybord -->
        <span>Extravert</span>
        <p id="social-attitude-hint" class="visually-hidden">1 is the most introverted, 9 is the most extraverted</p>
        <br>
        <fieldset>
            <legend>About me</legend>
            <textarea id="about-me" name="about-me" placeholder="Write a few words about yourself"></textarea> 
        </fieldset>
        <br>
        <div class="email-password">
          <div class="email">
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" autocomplete="email" required>
          </div>
          <div class="password">
            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required>
          </div>
        </div>
        <br>
        <div class="agreement-of-terms">
          <input type="checkbox" id="agreement-of-terms" name="agreement-of-terms" value="agreed" required>
          <label for="agreement-of-terms">I agree to the <a href="https://www.youtube.com/watch?v=dQw4w9WgXcQ">terms of service</a></label>
        </div>
      </section>

      <div class="button-container">
      <button type="submit" id="button">Sign Up</button>
      </div>

    </form>
  </main>
  <footer>
    <p>@Copyrights to VIA University Collage</p>
  </footer>
  <script>
    const slider = document.getElementById('social-attitude');

    function updateSliderProgress() {
      const ratio = (slider.value - slider.min) / (slider.max - slider.min);
      slider.style.setProperty('--progress', ratio);
    }

    slider.addEventListener('input', updateSliderProgress);
    updateSliderProgress();
  </script>
</body>
</html>
