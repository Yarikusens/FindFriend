<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
  <header>
    <nav>
      <ul>
        <li>
          <a href="#">Home</a>
        </li>
        <li>
          <a href="#">Browse</a>
        </li>
        <li>
          <a href="#">Profile</a>
        </li>
      </ul>
    </nav>
    <div>
      <h1>FindFriend</h1>
      <aside><img src=""><img src=""></aside>
      <h2>Sign Up</h2>
    </div>
  </header>
  <main>
    <form action=""> <!-- method="post" -->
      <section class="personal-info-and-photo">

        <content class="FullName">
          <input placeholder="Name" name="Name">
          <input placeholder="Surname" name="Name">
        </content>

        <br>

        <content class="Gender">
          <input type="radio" id="male" name="gender" value="male">
          <label for="male">Male</label>

          <input type="radio" id="female" name="gender" value="female">
          <label for="female">Female</label>

          <input type="radio" id="other" name="gender" value="other">
          <label for="other">Other</label>
        </content>

        <br>

        <content class="Birthday">
          <label for="birthday">Birthday:</label>
          <input type="date" id="birthdate" name="birthdate">
        </content>

        <br>

        <content class="Upload-Photo">
          <label for = "Upload-Photo"> Upload Photo </label>
          <input type = "file" id="upload" name="upload-photo">
        </content>
      </section>

      <section class="interests-nationalities">
        <label for="nationality">Nationality: </label>

        <select tabindex="7" name="nationality" required> <!-- tab indexes from here and below might be changed -->
          <option value="" disabled selected>Choose</option>
          <option value="estonian">Estonian</option>
          <option value="filipino">Filipino</option>
          <option value="norwegian">Norwegian</option>
          <option value="ukrainian">Ukrainian</option>
        </select>

        <label for="interests">Interests: </label>

        <select tabindex="8" name="interests" multiple size="1" required>
          <option value="games">Games</option>
          <option value="books">Books</option>
          <option value="movies">Movies</option>
          <option value="travel">Travel</option>
        </select>

      </section>

      <section class="the-rest">
        <label for="social-attitude" hidden="true">Social attitude</label> <!-- This should be visually hidden by display:none -->
        <span>Introvert</span>
        <input tabindex="9" type="range" id="social-attitude" name="social-attitude" aria-describedby="social-attitude-hint" min="1" max="9"> <!-- max=9 is not very smooth, but it is easy to enter using just a keybord -->
        <span>Extravert</span>
        <p id="social-attitude-hint" hidden="true">1 is the most introverted, 9 is the most extraverted</p> <!-- This should be visually hidden by display:none -->

        <br> <!-- to move down. This line might be deleted after setting flexbox layout -->

        <label for="about-me">About me</label>
        <textarea tabindex="10" id="about-me" name="about-me" rows="3" cols="50" placeholder="Write a few words about yourself"></textarea> <!-- rows="3" cols="50" might be changed in the future -->

        <br> <!-- to move down. This line might be deleted after setting flexbox layout -->

        <input tabindex="11" type="checkbox" id="agreement-of-terms" name="agreement-of-terms" value="agreed" required>
        <label for="agreed">I agree to the terms of service</label>
      </section>
      <button tabindex="12" type="submit">Sign Up</button>
    </form>
  </main>
  <footer>

  </footer>
</body>
</html>
