<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Find Friend | Sign Up</title>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find Friend | Sign up</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gveret+Levin&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Indie+Flower&display=swap" rel="stylesheet">

</head>
<body>
  <header>
    <nav>
      <ul>
        <li>
          <a href="#">Home</a>
        </li>
        <li>
        <a href="#">Browse</a>
        </li>
        <li>
        <a href="#">Profile</a>
        </li>
    </nav>
  </header>
  <main>
    <div>
      <h1 id="title">Find Friend</h1>
      <h2>Sign Up</h2>
      <div><img src="hearts.png" alt="heart decoration" id="hearts2"></div>
      <img src="hearts.png" alt="heart decoration2" id="hearts1">
      
    </div>
    <!-- <div>
      <h1>Find Friend</h1>
      <div class = "hearts">
        <aside><img src="hearts.png" height="100px"><img src="hearts.png" height="100px"></aside>
        <h2>Sign Up</h2>
      </div> 
    </div> -->
    <form action=""> <!-- method="post" -->
        <section class="personal-info-and-photo">
            <section class="personal-info">
                <content class="FullName">
                    <input placeholder="Name" name="Name">
                    <input placeholder="Surname" name="Surname">
                </content>
    
                <br>
    
                <content class="Gender">
                    <input type="radio" id="male" name="gender" value="male">
                    <label for="male">Male</label>
    
                    <input type="radio" id="female" name="gender" value="female">
                    <label for="female">Female</label>
    
                    <input type="radio" id="other" name="gender" value="other">
                    <label for="other">Other</label>
                </content>
    
                <br>
    
                <content class="Birthday">
                    <label for="birthday">Birthday:</label>
                    <input type="date" id="birthdate" name="birthdate">
                </content>
            </section>

            <content class="Upload-Photo">
                <input type="file" id="upload" hidden>
                <label for = "Upload-Photo">+</label>
                <p>Upload Photo</p>

            </content>
      </section>

      <section class="interests-nationalities">

        <select name="nationality" required>
          <option value="" disabled selected>Nationality</option>
          <option value="estonian">Estonian</option>
          <option value="filipino">Filipino</option>
          <option value="norwegian">Norwegian</option>
          <option value="ukrainian">Ukrainian</option>
        </select>
        <select name="interests" multiple size="1" required>
          <option value="" disabled selected>Interests</option>
          <option value="games">Games</option>
          <option value="books">Books</option>
          <option value="movies">Movies</option>
          <option value="travel">Travel</option>
        </select>

      </section>

      <section class="the-rest">
        <label for="social-attitude" hidden="true">Social attitude</label> <!-- This should be visually hidden by display:none -->
        <span>Introvert</span>
        <input type="range" id="social-attitude" name="social-attitude" aria-describedby="social-attitude-hint" min="1" max="9"> <!-- max=9 is not very smooth, but it is easy to enter using just a keybord -->
        <span>Extravert</span>
        <p id="social-attitude-hint" hidden="true">1 is the most introverted, 9 is the most extraverted</p> <!-- This should be visually hidden by display:none -->

        <br> <!-- to move down. This line might be deleted after setting flexbox layout -->
        <fieldset>
            <legend>About me</legend>
            <textarea id="about-me" name="about-me" placeholder="Write a few words about yourself"></textarea> <!-- rows="3" cols="50" might be changed in the future -->
        </fieldset>
        <br> <!-- to move down. This line might be deleted after setting flexbox layout -->

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>

        <label for="password">Password:</label>
        <input type="password" id="password" name="password" required>

        <br> <!-- to move down. This line might be deleted after setting flexbox layout -->

        <input type="checkbox" id="agreement-of-terms" name="agreement-of-terms" value="agreed" required>
        <label for="agreed">I agree to the terms of service</label>
      </section>

      <div class="button-container">
      <button type="submit" id="button">Sign Up</button>
      </div>

    </form>
  </main>
  <footer>
    <p>@Copyrights to VIA University Collage</p>
  </footer>
<script>
  const notes = document.getElementById("about-me");

function autoGrow() {
    notes.style.height = "auto";
    notes.style.height = notes.scrollHeight + "px";
}

notes.addEventListener("input", autoGrow);
window.addEventListener("load", autoGrow);
</script>
<script>
  const slider = document.getElementById('social-attitude');

  function updateSliderBackground() {
    const value = ((slider.value - slider.min) / (slider.max - slider.min)) * 100;
    slider.style.background = `linear-gradient(to right, #80a3c9 ${value}%, #ffffff ${value}%)`;
  }

  slider.addEventListener('input', updateSliderBackground);
  updateSliderBackground();
</script>
 
</body>
</html>
